############
#   Tmux   #
############

#-----------
# Config
#-----------

# Change leader key
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Set index 1
set -g base-index 1
set -g pane-base-index 1

#Mode Vim
setw -g mode-keys vi

#Enable mouse
set -g mouse on
if-shell "uname | grep -q Darwin" {
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
} {
  if-shell "grep -qi microsoft /proc/version 2>/dev/null" {
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
    bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
  } {
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"
  }
}

#Define interval
set -g status-interval 60
setw -g monitor-activity on
set -g visual-activity on

#Define history-limit
set -g history-limit 30000

# improve colors
set -g default-terminal "screen-256color"

#-----------
# Shortcuts
#-----------

# reload tmux.conf
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Horizontal split
bind V split-window -h -c "#{pane_current_path}"
# Vertical split
bind v split-window -v -c "#{pane_current_path}"

# Mapping movements
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Resize panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Align panels
bind R select-layout even-vertical

# Synchronize panels
bind g setw synchronize-panes \; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Git status on all panels
bind G set synchronize-panes on \; send-keys -t 1 'gst' C-m \; set synchronize-panes off


#-----------
# Style
#-----------

set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-style bg=colour234,fg=colour137

set -g status-left-length 30
set -g status-left "#[bg=colour238,fg=colour81,bold] #S #[bg=colour234,fg=colour238]"

set -g status-right-length 150
set -g status-right "#{?client_prefix,#[bg=colour167,fg=colour234,bold] PREFIX #[bg=colour234,fg=colour167],}#[fg=colour246,bg=colour238] %d %b %R "

setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-style fg=colour244,bg=colour234
setw -g window-status-format " #I:#W "

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour81

set -g message-style bg=colour167,fg=colour234

